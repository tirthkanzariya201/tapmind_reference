meta:
  package_versions_source: package_versions.yaml
  seed_source: GMA and Next-Gen release spreadsheets (Aug 2026)
  sync_note: Page generation must join product id + package name against package_versions.yaml
  products:
    - id: ca-gma
      name: Custom Adapter GMA SDK
      package_count: 36
    - id: ca-ng
      name: Custom Adapter GMA Next-Gen SDK
      package_count: 6

features:
  crash_fix_threadlocal:
    display_name: "Android API 25 crash fix"
    description: "Fixed a crash on Android API 25 and below caused by use of ThreadLocal.withInitial(), which requires API 26+. Replaced with a method supported on older API levels."
    scope: platform-level
    applies_to: "Android packages only, all mediations. Not applicable to any iOS package."
  discard_timeout_ad:
    display_name: "Discard late ad after timeout no-fill"
    description: "Each placement has a timeout starting when the adapter receives a request. If no ad is served within that timeout, the adapter sends a no-fill to mediation. This fix discards any ad that the underlying GMA (Google Mobile Ads, the demand source, distinct from GAM the mediation platform) demand returns after that no-fill was already sent, since it was previously not being discarded."
    scope: demand-level
    applies_to: "Every package, all frameworks, all platforms, all mediations, since GMA sits underneath as demand regardless of which mediation platform is on top."
  banner_ad_refresh:
    display_name: "Banner ad refresh"
    description: "Refreshes a banner ad using the same demand tags without a new backend call. Backend-configurable: enable/disable refresh, refresh interval, retry attempts, retry timeout."
    scope: sdk-level
    applies_to: "Packages built on a core SDK version that includes this feature."
  banner_ad_size_optimization:
    display_name: "Banner ad size optimization"
    description: "Previously, mediation would often request an incorrect size, or all sizes, relative to the actual ad container, causing ads that did not fit or overflowed. Fixed by ignoring the mediation-requested size and instead using a backend-configurable ad size."
    scope: sdk-level
    applies_to: "Packages built on a core SDK version that includes this feature."
  updated_classnames:
    display_name: "Standardized class names"
    description: "Standardization of adapter class names across mediations."
    scope: adapter-level
    applies_to: "Each adapter individually, as each is rebuilt."

